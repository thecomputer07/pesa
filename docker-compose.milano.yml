# Pesa — deploy produzione su VPS OVH Milano (57.131.24.56), dietro Caddy.
#
#   docker compose -f docker-compose.milano.yml up -d --build
#
# Caddy termina TLS per pesadia.com e fa reverse proxy su 127.0.0.1:8080.
# Il backend NON è esposto su internet (bind solo loopback).
# Segreti reali in .env.milano (NON committare).

services:
  # Certificato TLS self-signed per Postgres, generato una volta sola nel volume
  # pg_tls (chiave di proprieta' dell'utente postgres, uid 70 nell'immagine alpine).
  db-certs:
    image: alpine:3.20
    container_name: pesa-db-certs
    command:
      - sh
      - -c
      - >-
        test -s /tls/server.key ||
        (apk add --no-cache openssl >/dev/null &&
        openssl req -new -x509 -days 3650 -nodes -subj /CN=pesa-db
        -keyout /tls/server.key -out /tls/server.crt);
        chown 70:70 /tls/server.key /tls/server.crt && chmod 600 /tls/server.key
    volumes:
      - pg_tls:/tls
    restart: "no"

  db:
    image: postgres:16-alpine
    container_name: pesa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pesa
      POSTGRES_USER: pesa
      POSTGRES_PASSWORD: ${PESA_DB_PASSWORD:?set in .env.milano}
      LANG: it_IT.UTF-8
    # DB solo tra container, mai esposto. Dalla rete Docker solo TLS (pg_hba).
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - hba_file=/etc/pesa/pg_hba.conf
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_tls:/tls:ro
      - ./deploy/postgres/pg_hba.conf:/etc/pesa/pg_hba.conf:ro
    depends_on:
      db-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesa -d pesa"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      target: builder
    container_name: pesa-migrate
    command: ["/out/pesa", "migrate", "up"]
    environment:
      DATABASE_DSN: postgres://pesa:${PESA_DB_PASSWORD}@db:5432/pesa?sslmode=require
      PESA_ENV: dev
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      target: prod
    container_name: pesa-backend
    restart: unless-stopped
    environment:
      # TLS verso Postgres (cert self-signed nel volume pg_tls): "require" cifra
      # il traffico sulla rete Docker interna.
      DATABASE_DSN: postgres://pesa:${PESA_DB_PASSWORD}@db:5432/pesa?sslmode=require
      # "prod": cookie Secure, segreti obbligatori (vedi internal/config).
      PESA_ENV: prod
      PESA_ADDR: :8080
      LOG_SALT: ${LOG_SALT:?set in .env.milano}
      PESA_ERASURE_HASH_SALT: ${PESA_ERASURE_HASH_SALT:?set in .env.milano}
      PESA_EXPORT_TOKEN_SECRET: ${PESA_EXPORT_TOKEN_SECRET:?set in .env.milano}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env.milano}
      WEB_BASE_URL: https://pesadia.com
      HTTP_BASE_URL: https://pesadia.com
      COOKIE_DOMAIN: pesadia.com
      COOKIE_SECURE: "true"
      # Relay iRedMail su mail.area-23.it (Finlandia): DKIM/SPF/DMARC di
      # pesadia.com gia' configurati li'. Login consentito solo dall'IP Milano.
      SMTP_HOST: mail.area-23.it
      SMTP_PORT: "587"
      SMTP_USER: noreply@pesadia.com
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set in .env.milano}
      SMTP_FROM: "Pesa <noreply@pesadia.com>"
      OFF_USER_AGENT: "Pesa/0.1 (+https://pesadia.com)"
      PESA_IMAGE_CACHE_DIR: /home/pesa/.cache/images
      PESA_CACHE_DIR: /home/pesa/.cache/exports
      AUTOCERT_ENABLED: "false"
      # Log permanente (sopravvive ai deploy), ruotato dall'host: deploy/logrotate/pesa.
      PESA_LOG_FILE: /var/log/pesa/backend.log
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pesa_cache:/home/pesa/.cache
      - /var/log/pesa:/var/log/pesa
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
    name: pesa_pg_data
  pg_tls:
    name: pesa_pg_tls
  pesa_cache:
    name: pesa_cache
