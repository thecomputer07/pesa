# Pesa — Postgres in container (docker-compose.milano.yml).
# Socket locale (docker exec pg_dump/psql dei backup): trust come l'immagine ufficiale.
# Dalla rete Docker: solo TLS + password; connessioni in chiaro rifiutate.
local     all  all                 trust
host      all  all  127.0.0.1/32   trust
host      all  all  ::1/128        trust
hostssl   all  all  all            scram-sha-256
hostnossl all  all  all            reject
